# CI — runs on every push and pull request.
#   1. build:    install packages and build the website (catches code errors)
#   2. e2e:      Playwright end-to-end tests of the built site (desktop + phone)
#   3. database: run every Supabase SQL file on a fresh PostgreSQL, then the
#                security / approval tests in supabase/tests
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Unit tests (social-post function)
        run: node --test supabase/functions/social-post/lib.test.mjs

      - name: Unit tests (send-receipt function)
        run: node --test supabase/functions/send-receipt/lib.test.mjs

      - name: Build
        run: npm run build
        env:
          # Placeholders: the build only needs the names to exist
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

      - name: Check that the app code is in the build
        # If supabaseClient.js throws at load time the bundler drops the whole app
        run: grep -q "pending_changes" dist/assets/*.js || { echo "::error::App code missing from the bundle"; exit 1; }

      - name: Check that secrets are not in the build
        run: |
          # Real secret keys: "sb_secret_" followed by the key itself, or a JWT whose
          # payload says "service_role" (base64: c2VydmljZV9yb2xl). The words alone
          # appear inside the Supabase library and are fine.
          if grep -rIlE "sb_secret_[A-Za-z0-9_-]{16,}|c2VydmljZV9yb2xl" dist; then
            echo "::error::A secret key was found in the built website"; exit 1
          fi

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tests (desktop and phone)
        # Builds the site against a fake Supabase that the tests answer themselves (tests/e2e/support)
        run: npx playwright test

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  database:
    name: Database & security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Run SQL files and security tests
        run: bash supabase/tests/run-db-tests.sh
